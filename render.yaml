services:
  - type: web
    name: smartdialer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --config gunicorn.conf.py: starts the campaign's background thread
    # via gunicorn's post_fork hook, inside the actual worker process --
    # not at module-import time. Confirmed in production logs that this
    # environment's worker inherits the master's already-imported module
    # via fork() instead of re-importing fresh, and fork() doesn't carry
    # other threads into the child: a thread started at import time ran
    # perfectly, forever, in the master -- which never serves a single
    # HTTP request -- while every real request hit a worker whose copy of
    # `campaign` was frozen at None from the instant before the fork.
    # --timeout 120: a generous safety margin, kept regardless, since
    # Render's free tier runs on a shared/throttled CPU and the default
    # 30s gunicorn worker timeout leaves little room for the 530
    # sequential SQLite inserts done while seeding.
    startCommand: gunicorn web_dashboard:app --config gunicorn.conf.py --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      # Without this, Python block-buffers stdout when it isn't a TTY (as
      # on Render), so print()/traceback output from the background
      # campaign thread can sit unflushed indefinitely instead of showing
      # up in the log stream -- which is exactly what made this fail
      # silently on first deploy.
      - key: PYTHONUNBUFFERED
        value: "1"
