services:
  - type: web
    name: smartdialer
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # --timeout 120: Render's free tier runs on a heavily shared/throttled
    # CPU. Seeding 30 agents + 500 borrowers (530 sequential SQLite inserts
    # on startup) is fast on a normal machine but can occasionally exceed
    # gunicorn's default 30s worker timeout under contention, which kills
    # and restarts the "unresponsive" worker mid-seed -- forever, since the
    # replacement worker just re-seeds and gets killed again before it
    # finishes. Confirmed via /api/metrics's debug field showing a dead
    # background thread with the Campaign object never constructed.
    startCommand: gunicorn web_dashboard:app --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    envVars:
      # Without this, Python block-buffers stdout when it isn't a TTY (as
      # on Render), so print()/traceback output from the background
      # campaign thread can sit unflushed indefinitely instead of showing
      # up in the log stream -- which is exactly what made this fail
      # silently on first deploy.
      - key: PYTHONUNBUFFERED
        value: "1"
